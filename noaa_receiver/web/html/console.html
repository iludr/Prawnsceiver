<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOAAh's CrabArk — Debug Console</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: monospace; font-size: 16px; background: #1a1a2e; color: #e0e0e0; padding: 0 15px 12px; height: 100vh; display: flex; flex-direction: column; }
#header { margin: 0 -15px 12px; flex-shrink: 0; }
#toolbar { display: flex; gap: 15px; font-size: 0.75em; color: #888; margin-bottom: 8px; align-items: center; }
#toolbar label { cursor: pointer; }
#count { color: #f39c12; }
#toolbar { flex-shrink: 0; }
#console { background: #000; border: 1px solid #0f3460; border-radius: 4px; padding: 8px; flex: 1; min-height: 0; overflow-y: auto; font-size: 0.8em; line-height: 1.5; }
.line { white-space: pre-wrap; word-break: break-all; }
.line .t { color: #666; margin-right: 5px; }
.line.error { color: #e74c3c; }
.line.warn { color: #f39c12; }
.line.info { color: #e0e0e0; }
</style>
</head>
<body>
<div id="header">
    <div class="head-left">
        <img class="logo" src="/prawnceiver.jpg" alt="Prawnsceiver">
        <div>
            <h1>🛠️ NOAAh's CrabArk — Debug Console</h1>
            <div class="info">Last 100 server messages</div>
        </div>
    </div>
    <div class="head-right"><a href="/console.json">raw JSON</a></div>
</div>
<div id="toolbar">
    <label><input type="checkbox" id="autoscroll" checked> auto-scroll</label>
    <span id="count"></span>
</div>
<div id="console"></div>
<script src="/console.js"></script>
<script src="/nav.js"></script>
</body>
</html>
