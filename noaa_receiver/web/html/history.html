<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOAAh's CrabArk — Pass History & Recordings</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: monospace; font-size: 17px; background: #1a1a2e; color: #e0e0e0; padding: 0 15px 12px; }
#header { margin: 0 -15px 12px; }
.section-title { color: #53d769; font-size: 1em; margin: 14px 0 8px 0; }
.pass-card { background: #16213e; border: 1px solid #0f3460; border-left: 3px solid #53d769; margin-bottom: 10px; padding: 10px; border-radius: 4px; }
.pass-card.medium { border-left-color: #f39c12; }
.pass-card.low { border-left-color: #e74c3c; }
.card-head { font-size: 1em; color: #a8b8d8; margin-bottom: 6px; }
.card-head .sat { color: #53d769; font-weight: bold; font-size: 1.15em; }
.card-meta { font-size: 1em; color: #a8b8d8; margin-bottom: 8px; line-height: 1.6; }
.filename { font-size: 1em; color: #888; word-break: break-all; margin-bottom: 4px; }
button { padding: 5px 12px; background: #53d769; color: #1a1a2e; border: none; border-radius: 3px; cursor: pointer; font-family: monospace; font-size: 0.95em; }
button:hover { background: #3eb852; }
button.danger { background: #e74c3c; color: #fff; margin-left: 6px; }
button.danger:hover { background: #c0392b; }
button:disabled { opacity: 0.35; cursor: default; }
audio { width: 100%; margin-top: 6px; height: 30px; }
.decoded-img { max-width: 100%; margin-top: 8px; border-radius: 4px; border: 1px solid #0f3460; }
.result { font-size: 1em; margin-top: 6px; }
.muted { color: #666; font-size: 1em; padding: 10px; }
/* Decoded-image slideshow: every image of one recording (the flat
   composite plus all SatDump product images), one at a time, clickable
   through with the side buttons. Clicking the image opens the ORIGINAL
   in the in-page lightbox below - never a browser download.
   The preview frame has a FIXED height and letterboxes its images
   (object-fit: contain): aspect ratios differ per image, and a frame
   that grows/shrinks with the image would move the prev/next buttons
   under the cursor between clicks. */
.slideshow { margin-top: 8px; }
.slideshow-img { background: #000; border: 1px solid #0f3460; border-radius: 4px; cursor: zoom-in; height: 420px; display: flex; align-items: center; justify-content: center; }
.slideshow-img img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 4px; }
.slideshow-bar { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 0.9em; color: #a8b8d8; flex-wrap: wrap; }
.slideshow-bar button { padding: 2px 0; min-width: 48px; }
.slideshow-bar .count { color: #53d769; white-space: nowrap; min-width: 5em; text-align: center; }
.slideshow-bar .lbl { color: #888; word-break: break-all; flex: 1; min-width: 140px; }
/* Full-size lightbox overlay: shows the original image in the page */
#img-lightbox { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; cursor: zoom-out; }
#img-lightbox.show { display: flex; }
#img-lightbox img { max-width: 88vw; max-height: 80vh; border-radius: 6px; }
#img-lightbox .lb-cap { position: absolute; top: 8px; left: 0; right: 0; text-align: center; color: #a8b8d8; font-size: 0.9em; padding: 0 60px; word-break: break-all; }
#img-lightbox .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); padding: 8px 14px; }
#img-lightbox .lb-prev { left: 12px; }
#img-lightbox .lb-next { right: 12px; }
#img-lightbox .lb-close { position: absolute; top: 10px; right: 12px; padding: 2px 10px; }
@media (max-width: 560px) { .slideshow-img { height: 300px; } }
</style>
</head>
<body>
<div id="header">
    <div class="head-left">
        <img class="logo" src="/prawnceiver.jpg" alt="Prawnsceiver">
        <div>
            <h1>📚 Pass History &amp; Recordings</h1>
            <div class="info">🦀 Crabs caught: <span id="crab-count" style="color:#f39c12;font-weight:bold;">0</span></div>
        </div>
    </div>
    <div class="head-right"></div>
</div>
<div class="section-title">Recorded Passes</div>
<div id="history-list" class="muted">Loading pass history...</div>
<div id="histpager" style="margin:8px 0;display:none;">
    <button id="hist-prev">&#9664; newer</button>
    <button id="hist-next" style="margin-left:6px;">older &#9654;</button>
    <span id="hist-pageinfo" style="color:#888;margin-left:8px;"></span>
</div>
<div class="section-title" id="unmatched-title" style="display:none;">Unmatched Recordings</div>
<div id="unmatched-list"></div>
<div id="img-lightbox" onclick="closeLightbox(event)">
    <div class="lb-cap" id="lb-caption"></div>
    <button class="lb-close" onclick="closeLightbox()" title="Close (Esc)">&#10006;</button>
    <button class="lb-nav lb-prev" onclick="lightboxStep(-1); event.stopPropagation()" title="Previous (left arrow)">&#9664;</button>
    <img id="lb-img" src="" alt="Original decoded image">
    <button class="lb-nav lb-next" onclick="lightboxStep(1); event.stopPropagation()" title="Next (right arrow)">&#9654;</button>
</div>
<script src="/history.js"></script>
<script src="/nav.js"></script>
</body>
</html>
